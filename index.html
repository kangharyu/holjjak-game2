<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>홀짝 기록표</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,"Malgun Gothic",sans-serif;background:#f3f4f6;color:#111827}.app{max-width:650px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px}h1{text-align:center;font-size:25px;margin:0 0 20px}.current{text-align:center;font-size:20px;font-weight:bold;margin-bottom:14px}.buttons{display:flex;gap:8px;margin-bottom:8px}button{flex:1;border:0;border-radius:7px;padding:12px;font-size:17px;font-weight:bold;cursor:pointer}.odd{background:#e5edff;color:#2455b8}.even{background:#ffe5e5;color:#c62828}.success{background:#e3f5e8;color:#16803c}.fail{background:#eee;color:#555}button.selected{outline:3px solid #111827;outline-offset:-3px}.message{text-align:center;height:24px;margin:5px 0 10px;color:#666;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border-bottom:1px solid #e5e7eb;padding:10px;text-align:center}th{background:#f9fafb;font-size:14px;color:#666}td{font-size:16px}.reset{width:100%;margin-top:15px;background:#333;color:#fff;font-size:14px;padding:9px}.empty{color:#999;padding:25px}</style></head>
<body><div class="app"><h1>홀짝 기록표</h1><div class="current" id="current">1회차</div><div class="buttons"><button class="odd" id="odd">홀</button><button class="even" id="even">짝</button></div><div class="message" id="message">홀 또는 짝을 선택하세요.</div><div class="buttons"><button class="success" id="success">성공</button><button class="fail" id="fail">실패</button></div><table><thead><tr><th>회차</th><th>홀짝</th><th>결과</th></tr></thead><tbody id="records"><tr><td colspan="3" class="empty">아직 기록이 없습니다.</td></tr></tbody></table><button class="reset" id="reset">전체 기록 초기화</button></div>
<script>let choice="",round=1;const records=[];const odd=document.getElementById("odd"),even=document.getElementById("even"),message=document.getElementById("message"),current=document.getElementById("current"),tbody=document.getElementById("records");function selectChoice(v){choice=v;odd.classList.toggle("selected",v==="홀");even.classList.toggle("selected",v==="짝");message.textContent=v+" 선택"}function addRecord(result){if(!choice){message.textContent="먼저 홀 또는 짝을 선택하세요.";return}records.push({round,choice,result});round++;choice="";odd.classList.remove("selected");even.classList.remove("selected");render()}function render(){current.textContent=round+"회차";tbody.innerHTML=records.length?records.map(r=>`<tr><td>${r.round}회차</td><td>${r.choice}</td><td>${r.result}</td></tr>`).join(""): '<tr><td colspan="3" class="empty">아직 기록이 없습니다.</td></tr>';message.textContent="홀 또는 짝을 선택하세요."}odd.onclick=()=>selectChoice("홀");even.onclick=()=>selectChoice("짝");document.getElementById("success").onclick=()=>addRecord("성공");document.getElementById("fail").onclick=()=>addRecord("실패");document.getElementById("reset").onclick=()=>{if(records.length&&!confirm("전체 기록을 초기화할까요?"))return;records.length=0;round=1;choice="";odd.classList.remove("selected");even.classList.remove("selected");render()};</script></body></html>
